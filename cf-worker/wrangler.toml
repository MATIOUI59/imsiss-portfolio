name = "imsiss"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "CONTACT_MESSAGES"
id = "6e6223d4e8fc456ba0c5a00c3052512a"

[vars]
ALLOWED_ORIGINS = "https://imsiss.mouadsec.workers.dev,http://localhost:8091,http://127.0.0.1:8091"

# ANTHROPIC_API_KEY, TURNSTILE_SECRET_KEY and RESEND_API_KEY are NOT set here
# (this file is committed to git). Set them as encrypted secrets instead:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put TURNSTILE_SECRET_KEY
#   wrangler secret put RESEND_API_KEY
